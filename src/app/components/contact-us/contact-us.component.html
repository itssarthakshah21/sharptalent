<section id="contact" class="py-20 bg-gray-100">
    <div class="container mx-auto px-6 max-w-3xl bg-white p-10 rounded shadow-md">
      <h2 class="text-3xl font-bold text-center mb-4 text-gray-800">Contact Us</h2>
      <p class="text-center text-gray-600 mb-10">
        We'd love to hear from you! Fill out the form below and our team will get back to you shortly.
      </p>
  
      <form #contactForm="ngForm" (ngSubmit)="submitForm(contactForm)" novalidate>
        <!-- Full Name -->
        <div class="mb-4">
          <label class="block text-gray-700 mb-1">Full Name</label>
          <input
            type="text"
            class="w-full p-3 border rounded"
            name="name"
            required
            [(ngModel)]="form.name"
            #name="ngModel"
          />
          <p *ngIf="showErrors && name.invalid" class="text-red-500 text-sm mt-1">
            Full name is required.
          </p>
        </div>
  
        <!-- Email -->
        <div class="mb-4">
          <label class="block text-gray-700 mb-1">Email</label>
          <input
            type="email"
            class="w-full p-3 border rounded"
            name="email"
            required
            email
            [(ngModel)]="form.email"
            #email="ngModel"
          />
          <p *ngIf="showErrors && email.invalid" class="text-red-500 text-sm mt-1">
            Please enter a valid email.
          </p>
        </div>
  
        <!-- Phone -->
        <div class="mb-4">
          <label class="block text-gray-700 mb-1">Phone</label>
          <input
            type="tel"
            class="w-full p-3 border rounded"
            name="phone"
            required
            [(ngModel)]="form.phone"
            #phone="ngModel"
          />
          <p *ngIf="showErrors && phone.invalid" class="text-red-500 text-sm mt-1">
            Phone number is required.
          </p>
        </div>
  
        <!-- Upload Resume -->
        <div class="mb-4">
          <label class="block text-gray-700 mb-1">Upload Resume</label>
          <input type="file" class="w-full p-2 border rounded" (change)="onFileChange($event)" />
        </div>
  
        <!-- Message -->
        <div class="mb-4">
          <label class="block text-gray-700 mb-1">Message</label>
          <textarea
            rows="4"
            class="w-full p-3 border rounded"
            name="message"
            [(ngModel)]="form.message"
          ></textarea>
        </div>
  
        <!-- Submit -->
        <div class="text-center">
          <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
            Send Message
          </button>
        </div>
  
        <!-- Success Message -->
        <p *ngIf="submitted" class="mt-4 text-green-600 text-center">
          Thank you! Your message has been sent.
        </p>
      </form>
    </div>
  </section>
