<app-navbar></app-navbar>

<section class="py-20 bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto px-6 bg-white p-8 rounded shadow">
    <h2 class="text-3xl font-bold mb-2 text-center text-blue-700">
        Job Application Form
      </h2>
      <p *ngIf="jobTitle" class="text-lg text-center text-gray-600 mb-8">
        Applying for: <span class="font-medium text-gray-800">{{ jobTitle }}</span>
      </p>          

    <form [formGroup]="applicationForm" (ngSubmit)="submitForm()" enctype="multipart/form-data">
      <!-- Job Title (Pre-filled) -->
      <div class="mb-4">
        <label class="block font-medium mb-1">Job Title</label>
        <input type="text" formControlName="jobTitle" class="input" readonly />
      </div>

      <!-- Basic Info -->
      <div class="grid gap-4 md:grid-cols-2">
        <div>
          <label class="block mb-1">Full Name</label>
          <input type="text" formControlName="fullName" class="input" />
        </div>
        <div>
          <label class="block mb-1">Email</label>
          <input type="email" formControlName="email" class="input" />
        </div>
        <div>
          <label class="block mb-1">Phone</label>
          <input type="tel" formControlName="phone" class="input" />
        </div>
        <div>
          <label class="block mb-1">LinkedIn</label>
          <input type="url" formControlName="linkedIn" class="input" />
        </div>
        <div>
          <label class="block mb-1">GitHub</label>
          <input type="url" formControlName="github" class="input" />
        </div>
      </div>

      <!-- Education Section -->
      <!-- Education Section -->
<div class="mt-10">
    <h3 class="text-xl font-semibold mb-4">Education</h3>
    <div formArrayName="education">
      <div
        *ngFor="let edu of educationControls.controls; let i = index"
        [formGroupName]="i"
        class="mb-6 border p-4 rounded bg-gray-50 relative"
      >
        <button
          *ngIf="educationControls.length > 1"
          type="button"
          (click)="removeEducation(i)"
          class="absolute top-2 right-2 text-gray-400 hover:text-red-500 text-sm"
        >
          ✖
        </button>
  
        <input type="text" formControlName="university" placeholder="University Name" class="input mb-2" />
        <input type="text" formControlName="degree" placeholder="Degree Earned" class="input mb-2" />
        <div class="grid grid-cols-2 gap-4">
          <input type="date" formControlName="startDate" class="input" />
          <input type="date" formControlName="endDate" class="input" />
        </div>
      </div>
      <button type="button" (click)="addEducation()" class="text-blue-600 font-medium hover:underline mt-2">
        + Add More Education
      </button>
    </div>
  </div>
  
      


      <!-- Experience Section -->
      <!-- Work Experience Section -->
<div class="mt-10">
    <h3 class="text-xl font-semibold mb-4">Work Experience</h3>
    <div formArrayName="experience">
      <div
        *ngFor="let exp of experienceControls.controls; let i = index"
        [formGroupName]="i"
        class="mb-6 border p-4 rounded bg-gray-50 relative"
      >
        <button
          *ngIf="experienceControls.length > 1"
          type="button"
          (click)="removeExperience(i)"
          class="absolute top-2 right-2 text-gray-400 hover:text-red-500 text-sm"
        >
          ✖
        </button>
  
        <input type="text" formControlName="company" placeholder="Company Name" class="input mb-2" />
        <input type="text" formControlName="title" placeholder="Job Title" class="input mb-2" />
        <div class="grid grid-cols-2 gap-4">
          <input type="date" formControlName="startDate" class="input" />
          <input type="date" formControlName="endDate" class="input" />
        </div>
        <textarea formControlName="responsibilities" rows="3" placeholder="Responsibilities" class="input mt-2"></textarea>
      </div>
      <button type="button" (click)="addExperience()" class="text-blue-600 font-medium hover:underline mt-2">
        + Add More Experience
      </button>
    </div>
  </div>

      <!-- Skills -->
      <div class="mt-8">
        <label class="block mb-1 font-medium">Skills</label>
        <textarea formControlName="skills" rows="3" placeholder="List skills (comma separated)" class="input"></textarea>
      </div>

      <!-- Resume Upload -->
      <div class="mt-6">
        <label class="block mb-1 font-medium">Upload Resume (PDF)</label>
        <input type="file" (change)="onFileChange($event)" accept=".pdf" class="input" />
      </div>

      <!-- Submit -->
      <div class="text-center mt-8">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">
          Submit Application
        </button>
      </div>
    </form>
  </div>
</section>

<app-footer></app-footer>
